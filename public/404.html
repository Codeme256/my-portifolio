<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var path = window.location.pathname;
      var query = window.location.search;
      var hash = window.location.hash;
      var base = '/my-portifolio';
      var redirect = base + '/?p=' + encodeURIComponent(path + query) + hash;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
