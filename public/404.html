<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var l = window.location;
      var base = '/my-portifolio/';
      var path = l.pathname.replace(base, '');
      sessionStorage.setItem('redirect', path || '/');
      l.replace(l.origin + base);
    </script>
  </head>

</html>
